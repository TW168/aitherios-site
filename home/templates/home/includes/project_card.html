{% load wagtailcore_tags wagtailimages_tags i18n %}
<a class="card" href="{% pageurl project %}">
  <div class="card__image">
    {% if project.card_image %}
      {% image project.card_image fill-800x440 alt="" %}
    {% else %}
      <div class="card__placeholder" aria-hidden="true"></div>
    {% endif %}
  </div>
  <div class="card__body">
    <h3 class="card__title">{{ project.title }}</h3>
    <p class="card__summary">{{ project.summary }}</p>
    <span class="card__more">{% trans "View project" %} →</span>
  </div>
</a>
