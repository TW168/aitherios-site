{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<section class="section">
  <div class="container">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.intro %}<div class="rich-text lead">{{ page.intro|richtext }}</div>{% endif %}
    <div class="card-grid">
      {% for project in projects %}
        {% include "home/includes/project_card.html" with project=project %}
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
