{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<article class="section">
  <div class="container narrow">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="lead">{{ page.summary }}</p>
    <div class="rich-text">{{ page.body|richtext }}</div>
  </div>
</article>
{% endblock %}
